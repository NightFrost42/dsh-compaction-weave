<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title>Context Surface Before &amp; After: 4-Layer Compaction &amp; BM25F Archive Lookup</title>
  <desc>Compares the visible context surface before and after Weave v0.6.0 compaction across its 4 layered mechanisms (Persisted-Output, idle Microcompact/Collapse, Observation Masking + checkpoint summary/Session Memory, Snip emergency rescue, and dual-watermark image/offload), 36 built-in reference source channels, and lossless zstd archive with BM25F lookup.</desc>
  <defs>
    <marker id="arrow-dark-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0369A1" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="760" fill="#F8FAFC" />
  <text x="700" y="50" text-anchor="middle" font-size="30" font-weight="bold" fill="#0F172A">Context Surface: 4-Layer Compaction, Tail &amp; BM25F Archive Lookup</text>
  <text x="60" y="92" font-size="22" font-weight="bold" fill="#334155">Before Compaction: Visible Conversation Surface</text>
  <rect x="60" y="108" width="380" height="155" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5" />
  <text x="84" y="145" font-size="21" font-weight="bold" fill="#0F172A">1. Preserved Prefix</text>
  <text x="84" y="182" font-size="18" fill="#334155">
    <tspan x="84" dy="0">System framing, instructions,</tspan>
    <tspan x="84" dy="30">and prior accepted checkpoints</tspan>
    <tspan x="84" dy="30">Incremental after latest one</tspan>
  </text>
  <rect x="470" y="108" width="460" height="155" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5" stroke-dasharray="8 5" />
  <text x="494" y="145" font-size="21" font-weight="bold" fill="#92400E">2. Layered Compaction &amp; Image Offload</text>
  <text x="494" y="182" font-size="17" fill="#78350F">
    <tspan x="494" dy="0">Warm Persisted-Output / Idle Microcompact</tspan>
    <tspan x="494" dy="29">Observation Masking (Tier-4) -&gt; Summary</tspan>
    <tspan x="494" dy="29">Snip rescue; image/offload keeps 6 newest</tspan>
  </text>
  <rect x="960" y="108" width="380" height="155" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5" />
  <text x="984" y="145" font-size="21" font-weight="bold" fill="#0F172A">3. Preserved Recent Tail</text>
  <text x="984" y="182" font-size="18" fill="#334155">
    <tspan x="984" dy="0">Auto default: 16% of budget</tspan>
    <tspan x="984" dy="30">(e.g., 30,689t when M=191,808)</tspan>
    <tspan x="984" dy="30">0-LLM spill on unsent &gt;=32k outputs</tspan>
  </text>
  <line x1="250" y1="320" x2="250" y2="332" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow-dark-en)" />
  <line x1="700" y1="320" x2="700" y2="332" stroke="#0369A1" stroke-width="3" marker-end="url(#arrow-blue-en)" />
  <line x1="1150" y1="320" x2="1150" y2="332" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow-dark-en)" />
  <text x="60" y="322" font-size="22" font-weight="bold" fill="#334155">After Commit: Visible Request Messages Read by the Model</text>
  <rect x="60" y="338" width="380" height="172" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2.5" />
  <text x="84" y="375" font-size="21" font-weight="bold" fill="#0F172A">1. Preserved Prefix (Exact)</text>
  <text x="84" y="412" font-size="18" fill="#334155">
    <tspan x="84" dy="0">Kept byte-for-byte on surface;</tspan>
    <tspan x="84" dy="30">try verbatim KV prefix same-route</tspan>
    <tspan x="84" dy="30">(Context Collapse: idle TTL only)</tspan>
  </text>
  <rect x="470" y="338" width="460" height="172" rx="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="3" />
  <text x="494" y="375" font-size="21" font-weight="bold" fill="#0C4A6E">2. Checkpoint or 0-LLM Stubs</text>
  <text x="494" y="412" font-size="17" fill="#0369A1">
    <tspan x="494" dy="0">9-sec summary (or Session Memory) + k:v</tspan>
    <tspan x="494" dy="29">+ History archive pointer, files &amp; dates</tspan>
    <tspan x="494" dy="29">Strictly smaller in tokens &amp; UTF-8 bytes</tspan>
  </text>
  <rect x="960" y="338" width="380" height="172" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2.5" />
  <text x="984" y="375" font-size="21" font-weight="bold" fill="#0F172A">3. Tail + Redacted Re-Inject</text>
  <text x="984" y="412" font-size="18" fill="#334155">
    <tspan x="984" dy="0">Model reads ONLY this visible list;</tspan>
    <tspan x="984" dy="30">recent workspace files (&lt;=24 KB)</tspan>
    <tspan x="984" dy="30">Older spans queried via BM25F tools</tspan>
  </text>
  <line x1="1120" y1="568" x2="1120" y2="515" stroke="#0369A1" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-blue-en)" />
  <rect x="60" y="572" width="460" height="155" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
  <text x="84" y="609" font-size="21" font-weight="bold" fill="#0F172A">Quotes, 36 Channels &amp; 6-Layer Audit</text>
  <text x="84" y="646" font-size="17" fill="#334155">
    <tspan x="84" dy="0">Sec. 6 quotes (&lt;=32 / 4096t) + recent scope</tspan>
    <tspan x="84" dy="29">DSH V4 + IM bridge channels + XML tags</tspan>
    <tspan x="84" dy="29">Global redlines: polarity, vals, [seq N]</tspan>
  </text>
  <path d="M 918 250 L 946 250 L 946 553 L 946 568" fill="none" stroke="#0369A1" stroke-width="2.5" marker-end="url(#arrow-blue-en)" />
  <rect x="550" y="572" width="790" height="155" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="2.5" />
  <text x="574" y="609" font-size="21" font-weight="bold" fill="#14532D">Lossless zstd Archive (Written Before Any Mask, Prune, or Commit)</text>
  <text x="574" y="646" font-size="17" fill="#166534">
    <tspan x="574" dy="0">0o700/0o600 originals &amp; offloaded images with SHA-256 verification</tspan>
    <tspan x="574" dy="29">Queried ON DEMAND via history_list / BM25F history_search (2-hop) / history_read</tspan>
    <tspan x="574" dy="29">External files may change later; distinguish archived snapshot from live disk</tspan>
  </text>
</svg>
