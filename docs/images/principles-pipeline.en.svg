<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title>Compaction Pipeline: Generate, Validate, Archive, Then Commit</title>
  <desc>Two-row pipeline diagram showing trigger and window measurement, span and prefix policy, source extraction and UTF-8 budget check, single-target candidate generation, full validation with finite retries, backend capacity continuation, pre-commit archiving, and durable transaction commit.</desc>
  <defs>
    <marker id="p-arrow-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="p-arrow-amber-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#B45309" />
    </marker>
    <marker id="p-arrow-green-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#15803D" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="780" fill="#F8FAFC" />
  <text x="720" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#0F172A">Compaction Pipeline: Generate, Validate, Archive, Then Commit</text>
  <rect x="45" y="105" width="305" height="215" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
  <text x="65" y="142" font-size="22" font-weight="bold" fill="#0F172A">1. Trigger &amp; Measure</text>
  <text x="65" y="178" font-size="20" fill="#334155">
    <tspan x="65" dy="0">Auto threshold T, /compact,</tspan>
    <tspan x="65" dy="30">or context_compact (queued)</tspan>
    <tspan x="65" dy="30">Reserve output + headroom</tspan>
    <tspan x="65" dy="30">T=floor(min(0.8W,W-O-H))</tspan>
  </text>
  <line x1="350" y1="212" x2="390" y2="212" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow-en)" />
  <rect x="395" y="105" width="305" height="215" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
  <text x="415" y="142" font-size="22" font-weight="bold" fill="#0F172A">2. Span &amp; Prefix Policy</text>
  <text x="415" y="178" font-size="20" fill="#334155">
    <tspan x="415" dy="0">Select tool-balanced span;</tspan>
    <tspan x="415" dy="30">incremental after checkpoint</tspan>
    <tspan x="415" dy="30">Merge only on limit (4),</tspan>
    <tspan x="415" dy="30">retired req, or low savings</tspan>
  </text>
  <line x1="700" y1="212" x2="740" y2="212" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow-en)" />
  <rect x="745" y="105" width="305" height="215" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
  <text x="765" y="142" font-size="22" font-weight="bold" fill="#0F172A">3. Sources &amp; Byte Budget</text>
  <text x="765" y="178" font-size="20" fill="#334155">
    <tspan x="765" dy="0">Extract active reqs &amp; report;</tspan>
    <tspan x="765" dy="30">Quote manifest; read coords</tspan>
    <tspan x="765" dy="30">Conservative UTF-8 budget</tspan>
    <tspan x="765" dy="30">Double scale on overflow</tspan>
  </text>
  <line x1="1050" y1="212" x2="1090" y2="212" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow-en)" />
  <rect x="1095" y="105" width="300" height="215" rx="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5" />
  <text x="1115" y="142" font-size="22" font-weight="bold" fill="#0C4A6E">4. Single-Target Call</text>
  <text x="1115" y="178" font-size="20" fill="#0369A1">
    <tspan x="1115" dy="0">1st resolved route only</tspan>
    <tspan x="1115" dy="30">Single target; no failover</tspan>
    <tspan x="1115" dy="30">1st try + 2 retries (180s)</tspan>
    <tspan x="1115" dy="30">Up to 32 sequential chunks</tspan>
  </text>
  <line x1="1210" y1="320" x2="1210" y2="430" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow-en)" />
  <line x1="1290" y1="435" x2="1290" y2="325" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p-arrow-amber-en)" />
  <text x="1250" y="382" text-anchor="middle" font-size="20" font-weight="bold" fill="#B45309">Finite corrective retries</text>
  <rect x="1095" y="435" width="300" height="225" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5" />
  <text x="1115" y="472" font-size="22" font-weight="bold" fill="#92400E">5. Full Validation</text>
  <text x="1115" y="508" font-size="20" fill="#78350F">
    <tspan x="1115" dy="0">Structure + exact quotes</tspan>
    <tspan x="1115" dy="30">Requirements: align at 0.6</tspan>
    <tspan x="1115" dy="30">Progress: source-backed</tspan>
    <tspan x="1115" dy="30">Strict token &amp; byte shrinkage</tspan>
  </text>
  <line x1="895" y1="320" x2="895" y2="430" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p-arrow-amber-en)" />
  <line x1="1095" y1="525" x2="1055" y2="525" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p-arrow-amber-en)" />
  <line x1="1055" y1="575" x2="1090" y2="575" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow-en)" />
  <rect x="745" y="435" width="305" height="225" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5" />
  <text x="765" y="472" font-size="22" font-weight="bold" fill="#92400E">6. Backend Continuation</text>
  <text x="765" y="508" font-size="20" fill="#78350F">
    <tspan x="765" dy="0">Eligible capacity errors only;</tspan>
    <tspan x="765" dy="30">4-section notes (12 KiB) +</tspan>
    <tspan x="765" dy="30">Exact active requirements</tspan>
    <tspan x="765" dy="30">Save pages and usage ledger</tspan>
  </text>
  <path d="M 1245 660 L 1245 725 L 547 725 L 547 665" fill="none" stroke="#15803D" stroke-width="3" marker-end="url(#p-arrow-green-en)" />
  <text x="895" y="712" text-anchor="middle" font-size="20" font-weight="bold" fill="#15803D">All checks passed -&gt; Write &amp; verify archive BEFORE transaction commit</text>
  <rect x="395" y="435" width="305" height="225" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="2.5" />
  <text x="415" y="472" font-size="22" font-weight="bold" fill="#14532D">7. Pre-Commit Archive</text>
  <text x="415" y="508" font-size="20" fill="#166534">
    <tspan x="415" dy="0">Write original span &amp; files</tspan>
    <tspan x="415" dy="30">Verify required archive</tspan>
    <tspan x="415" dy="30">Abort on archive failure;</tspan>
    <tspan x="415" dy="30">Archives enabled by default</tspan>
  </text>
  <line x1="395" y1="548" x2="355" y2="548" stroke="#15803D" stroke-width="3" marker-end="url(#p-arrow-green-en)" />
  <rect x="45" y="435" width="305" height="225" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="3" />
  <text x="65" y="472" font-size="22" font-weight="bold" fill="#14532D">8. Commit &amp; Resume</text>
  <text x="65" y="508" font-size="20" fill="#166534">
    <tspan x="65" dy="0">Host checked; back up log</tspan>
    <tspan x="65" dy="30">Write log; record success</tspan>
    <tspan x="65" dy="30">Publish live events &amp; continue</tspan>
    <tspan x="65" dy="30">History lookup on demand</tspan>
  </text>
</svg>
