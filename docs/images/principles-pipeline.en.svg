<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title>4-Layer Compaction Pipeline: 0-LLM Filters, Concurrent Generation, Ordered Commit &amp; BM25F</title>
  <desc>Two-row pipeline diagram showing Weave v0.6.0 layered compaction: warm Persisted-Output / idle Microcompact / Observation Masking (Tier-4) / Snip and image/offload, Session Memory or verbatim prefix reuse, 37-channel isolation and UTF-8 byte budget, single-target route-aware effort and 2-worker parallel generation with resumable breakpoints, 6-layer validation and controlled fallback, backend continuation, zstd archiving with strictHostFingerprints:false compatible commit, and BM25F lookup.</desc>
  <defs>
    <marker id="p-arrow-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="p-arrow-amber-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#B45309" />
    </marker>
    <marker id="p-arrow-green-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#15803D" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="780" fill="#F8FAFC" />
  <text x="720" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#0F172A">Layered Pipeline: 0-LLM Filters, Concurrent Gen, Ordered Commit &amp; BM25F</text>
  <rect x="45" y="105" width="305" height="215" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
  <text x="65" y="142" font-size="20" font-weight="bold" fill="#0F172A">1. Layers &amp; 0-LLM Filters</text>
  <text x="65" y="178" font-size="16" fill="#334155">
    <tspan x="65" dy="0">Warm Spill / Idle Microcompact</tspan>
    <tspan x="65" dy="30">Mask &gt;4k (Tier-4) + image/offload</tspan>
    <tspan x="65" dy="30">Re-measure; stop if target met</tspan>
    <tspan x="65" dy="30">Hard wall / 413 -&gt; Snip rescue</tspan>
  </text>
  <line x1="350" y1="212" x2="390" y2="212" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow-en)" />
  <rect x="395" y="105" width="305" height="215" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
  <text x="415" y="142" font-size="20" font-weight="bold" fill="#0F172A">2. Span &amp; Prefix / Memory</text>
  <text x="415" y="178" font-size="16" fill="#334155">
    <tspan x="415" dy="0">Select tool-balanced span;</tspan>
    <tspan x="415" dy="30">reuse verified Session Memory</tspan>
    <tspan x="415" dy="30">Exact KV prefix if same-route</tspan>
    <tspan x="415" dy="30">Merge on idle / 4-cap / revision</tspan>
  </text>
  <line x1="700" y1="212" x2="740" y2="212" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow-en)" />
  <rect x="745" y="105" width="305" height="215" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
  <text x="765" y="142" font-size="20" font-weight="bold" fill="#0F172A">3. Channels &amp; Dual Budget</text>
  <text x="765" y="178" font-size="16" fill="#334155">
    <tspan x="765" dy="0">37 host kinds + XML isolate refs</tspan>
    <tspan x="765" dy="30">Extract reqs, k:v &amp; date anchors</tspan>
    <tspan x="765" dy="30">Project reads if off-route</tspan>
    <tspan x="765" dy="30">Token + UTF-8 dual budget caps</tspan>
  </text>
  <line x1="1050" y1="212" x2="1090" y2="212" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow-en)" />
  <rect x="1095" y="105" width="300" height="215" rx="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5" />
  <text x="1115" y="142" font-size="20" font-weight="bold" fill="#0C4A6E">4. Concurrent Gen &amp; Resume</text>
  <text x="1115" y="178" font-size="16" fill="#0369A1">
    <tspan x="1115" dy="0">singleTarget + effort:auto route</tspan>
    <tspan x="1115" dy="30">concurrency=2 probe+parallel gen</tspan>
    <tspan x="1115" dy="30">429 drops concurrency to 1</tspan>
    <tspan x="1115" dy="30">Pause/crash keeps breakpoint</tspan>
  </text>
  <line x1="1210" y1="320" x2="1210" y2="430" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow-en)" />
  <line x1="1290" y1="435" x2="1290" y2="325" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p-arrow-amber-en)" />
  <text x="1250" y="382" text-anchor="middle" font-size="18" font-weight="bold" fill="#B45309">6-layer audit / repair</text>
  <rect x="1095" y="435" width="300" height="225" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5" />
  <text x="1115" y="472" font-size="20" font-weight="bold" fill="#92400E">5. 6-Layer Audit &amp; Fallback</text>
  <text x="1115" y="508" font-size="16" fill="#78350F">
    <tspan x="1115" dy="0">9 secs + Sec. 6 + shrink checks</tspan>
    <tspan x="1115" dy="30">recent scope + global redlines</tspan>
    <tspan x="1115" dy="30">Split [seq N] grants &amp; k:v facts</tspan>
    <tspan x="1115" dy="30">&lt;=3 pure coverage pin fallback</tspan>
  </text>
  <line x1="895" y1="320" x2="895" y2="430" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p-arrow-amber-en)" />
  <line x1="1095" y1="525" x2="1055" y2="525" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p-arrow-amber-en)" />
  <line x1="1055" y1="575" x2="1090" y2="575" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow-en)" />
  <rect x="745" y="435" width="305" height="225" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5" />
  <text x="765" y="472" font-size="20" font-weight="bold" fill="#92400E">6. Backend Continuation</text>
  <text x="765" y="508" font-size="16" fill="#78350F">
    <tspan x="765" dy="0">Capacity / not-smaller errors;</tspan>
    <tspan x="765" dy="30">4-section notes (12 KiB) +</tspan>
    <tspan x="765" dy="30">Exact active requirements</tspan>
    <tspan x="765" dy="30">Persist pages and usage ledger</tspan>
  </text>
  <path d="M 1245 660 L 1245 725 L 547 725 L 547 665" fill="none" stroke="#15803D" stroke-width="3" marker-end="url(#p-arrow-green-en)" />
  <text x="895" y="712" text-anchor="middle" font-size="18" font-weight="bold" fill="#15803D">Drain ordered inFlightCommits -&gt; archive -&gt; commit; then redacted file re-injection</text>
  <rect x="395" y="435" width="305" height="225" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="2.5" />
  <text x="415" y="472" font-size="20" font-weight="bold" fill="#14532D">7. Ordered zstd Archive</text>
  <text x="415" y="508" font-size="16" fill="#166534">
    <tspan x="415" dy="0">Lossless zstd span &amp; attachments</tspan>
    <tspan x="415" dy="30">Verify counts and sequences</tspan>
    <tspan x="415" dy="30">Abort on archive failure;</tspan>
    <tspan x="415" dy="30">Checkpoint notes archive ID</tspan>
  </text>
  <line x1="395" y1="548" x2="355" y2="548" stroke="#15803D" stroke-width="3" marker-end="url(#p-arrow-green-en)" />
  <rect x="45" y="435" width="305" height="225" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="3" />
  <text x="65" y="472" font-size="20" font-weight="bold" fill="#14532D">8. Commit &amp; BM25F Lookup</text>
  <text x="65" y="508" font-size="16" fill="#166534">
    <tspan x="65" dy="0">Check .rollback log &amp; host digests</tspan>
    <tspan x="65" dy="30">strictHostFingerprints:false</tspan>
    <tspan x="65" dy="30">falls back to Session.append</tspan>
    <tspan x="65" dy="30">BM25F search + redacted reinject</tspan>
  </text>
</svg>
