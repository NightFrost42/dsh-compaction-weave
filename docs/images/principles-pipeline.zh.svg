<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title>分层压缩、并发按序提交与事务校验流水线</title>
  <desc>展示 DSH Compaction Weave 四层压缩流水线：热尾 Persisted-Output / 闲置 Microcompact / 压力 Observation Masking / 红线 Snip 与双水位 image/offload、选区与同路由前缀复用、通道隔离与 UTF-8 字节预算、单目标自适应推理与 2 路并发按序生成、6 层校验与受控兜底、断点续传/分页接续、zstd 归档与 strictHostFingerprints:false 兼容降级及 BM25F 回查。</desc>
  <defs>
    <marker id="p-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="p-arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#B45309" />
    </marker>
    <marker id="p-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#15803D" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="780" fill="#F8FAFC" />
  <text x="720" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#0F172A">分层压缩流水线：0-LLM 前置过滤、并发按序提交与兼容回查</text>
  <rect x="45" y="105" width="305" height="215" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
  <text x="65" y="142" font-size="20" font-weight="bold" fill="#0F172A">1. 分层触发与 0-LLM 过滤</text>
  <text x="65" y="178" font-size="16" fill="#334155">
    <tspan x="65" dy="0">热尾 Spill / 闲置 Microcompact</tspan>
    <tspan x="65" dy="30">超4k折叠(Tier-4) + image/offload</tspan>
    <tspan x="65" dy="30">复测达标直接跳过摘要模型</tspan>
    <tspan x="65" dy="30">逼近红线/413由 Snip 0-LLM 急救</tspan>
  </text>
  <line x1="350" y1="212" x2="390" y2="212" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow)" />
  <rect x="395" y="105" width="305" height="215" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
  <text x="415" y="142" font-size="20" font-weight="bold" fill="#0F172A">2. 选区与前缀 / 记忆复用</text>
  <text x="415" y="178" font-size="16" fill="#334155">
    <tspan x="415" dy="0">选完整配对工具调用区间</tspan>
    <tspan x="415" dy="30">可选核验复用 Session Memory</tspan>
    <tspan x="415" dy="30">同路由装得下保留原样 KV 前缀</tspan>
    <tspan x="415" dy="30">闲置 / 上限(4) / 修订时合并</tspan>
  </text>
  <line x1="700" y1="212" x2="740" y2="212" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow)" />
  <rect x="745" y="105" width="305" height="215" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
  <text x="765" y="142" font-size="20" font-weight="bold" fill="#0F172A">3. 通道隔离与双轨预算</text>
  <text x="765" y="178" font-size="16" fill="#334155">
    <tspan x="765" dy="0">37 项宿主通道 + XML 隔离引用</tspan>
    <tspan x="765" dy="30">提取要求、k:v 进度与相对日期</tspan>
    <tspan x="765" dy="30">非同路由或超限改走坐标投影</tspan>
    <tspan x="765" dy="30">Token + UTF-8 字节双轨预算</tspan>
  </text>
  <line x1="1050" y1="212" x2="1090" y2="212" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow)" />
  <rect x="1095" y="105" width="300" height="215" rx="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5" />
  <text x="1115" y="142" font-size="20" font-weight="bold" fill="#0C4A6E">4. 单目标并发生成与断点</text>
  <text x="1115" y="178" font-size="16" fill="#0369A1">
    <tspan x="1115" dy="0">singleTarget + effort:auto 适配</tspan>
    <tspan x="1115" dy="30">concurrency=2 先探针后并行生成</tspan>
    <tspan x="1115" dy="30">429 自动降并发至 1 并冷却重试</tspan>
    <tspan x="1115" dy="30">暂停/崩退留断点按序续传</tspan>
  </text>
  <line x1="1210" y1="320" x2="1210" y2="430" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow)" />
  <line x1="1290" y1="435" x2="1290" y2="325" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p-arrow-amber)" />
  <text x="1250" y="382" text-anchor="middle" font-size="18" font-weight="bold" fill="#B45309">6 层审计重试 / 重构</text>
  <rect x="1095" y="435" width="300" height="225" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5" />
  <text x="1115" y="472" font-size="20" font-weight="bold" fill="#92400E">5. 6 层无环审计与兜底</text>
  <text x="1115" y="508" font-size="16" fill="#78350F">
    <tspan x="1115" dy="0">九节 + 第6节 + 归档指针与缩小</tspan>
    <tspan x="1115" dy="30">recent 覆盖(0.6) + 极性/数值全局红线</tspan>
    <tspan x="1115" dy="30">拆段 [seq N] 授权与 k:v 进度验源</tspan>
    <tspan x="1115" dy="30">耗尽仅 ≤3 覆盖可外挂原话兜底</tspan>
  </text>
  <line x1="895" y1="320" x2="895" y2="430" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p-arrow-amber)" />
  <line x1="1095" y1="525" x2="1055" y2="525" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p-arrow-amber)" />
  <line x1="1055" y1="575" x2="1090" y2="575" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow)" />
  <rect x="745" y="435" width="305" height="225" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5" />
  <text x="765" y="472" font-size="20" font-weight="bold" fill="#92400E">6. 后台容量分页接续</text>
  <text x="765" y="508" font-size="16" fill="#78350F">
    <tspan x="765" dy="0">容量 / 未缩小等特定拒绝触发</tspan>
    <tspan x="765" dy="30">四节笔记（默认 12 KiB）+</tspan>
    <tspan x="765" dy="30">有效要求逐字独立驻留</tspan>
    <tspan x="765" dy="30">持久化已接受页与并发账本</tspan>
  </text>
  <path d="M 1245 660 L 1245 725 L 547 725 L 547 665" fill="none" stroke="#15803D" stroke-width="3" marker-end="url(#p-arrow-green)" />
  <text x="895" y="712" text-anchor="middle" font-size="18" font-weight="bold" fill="#15803D">排空按序提交并发回调（inFlightCommits）并归档后提交；工作区文件随后脱敏重注入</text>
  <rect x="395" y="435" width="305" height="225" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="2.5" />
  <text x="415" y="472" font-size="20" font-weight="bold" fill="#14532D">7. 按序归档与 zstd 存储</text>
  <text x="415" y="508" font-size="16" fill="#166534">
    <tspan x="415" dy="0">zstd 无损写入跨度原文与附件</tspan>
    <tspan x="415" dy="30">回读校验条数与事件序号</tspan>
    <tspan x="415" dy="30">归档失败则中止并保留原文</tspan>
    <tspan x="415" dy="30">检查点附 History archive 指针</tspan>
  </text>
  <line x1="395" y1="548" x2="355" y2="548" stroke="#15803D" stroke-width="3" marker-end="url(#p-arrow-green)" />
  <rect x="45" y="435" width="305" height="225" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="3" />
  <text x="65" y="472" font-size="20" font-weight="bold" fill="#14532D">8. 事务兼容提交与 BM25F 回查</text>
  <text x="65" y="508" font-size="16" fill="#166534">
    <tspan x="65" dy="0">核验无未恢复 .rollback 日志与指纹</tspan>
    <tspan x="65" dy="30">默认 strictHostFingerprints:false</tspan>
    <tspan x="65" dy="30">小版本变动降级 Session.append</tspan>
    <tspan x="65" dy="30">BM25F history_search + 脱敏重注入</tspan>
  </text>
</svg>
