<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title>压缩与校验流水线：先生成校验、再归档、最后事务提交</title>
  <desc>两行展示 DSH Compaction Weave 常规与容量接续流水线：触发与测量、增量选区、构建源要求与报告、单目标生成、完整校验、后台分页接续、提交前归档、持久事务提交。</desc>
  <defs>
    <marker id="p-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="p-arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#B45309" />
    </marker>
    <marker id="p-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#15803D" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="780" fill="#F8FAFC" />
  <text x="720" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#0F172A">压缩与校验流水线：先生成校验、再归档、最后事务提交</text>
  <rect x="45" y="105" width="305" height="215" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
  <text x="65" y="142" font-size="22" font-weight="bold" fill="#0F172A">1. 触发与窗口测量</text>
  <text x="65" y="178" font-size="20" fill="#334155">
    <tspan x="65" dy="0">自动阈值 T / 手动 /compact</tspan>
    <tspan x="65" dy="30">或 context_compact(queued)</tspan>
    <tspan x="65" dy="30">预留主输出 O 与提前量 H</tspan>
    <tspan x="65" dy="30">T = floor(min(0.8W, W-O-H))</tspan>
  </text>
  <line x1="350" y1="212" x2="390" y2="212" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow)" />
  <rect x="395" y="105" width="305" height="215" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
  <text x="415" y="142" font-size="22" font-weight="bold" fill="#0F172A">2. 选区与增量策略</text>
  <text x="415" y="178" font-size="20" fill="#334155">
    <tspan x="415" dy="0">选完整配对工具调用区间</tspan>
    <tspan x="415" dy="30">优先在最新检查点后增量</tspan>
    <tspan x="415" dy="30">达上限(4)/修订旧要求/</tspan>
    <tspan x="415" dy="30">空间不足时才合并旧检查点</tspan>
  </text>
  <line x1="700" y1="212" x2="740" y2="212" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow)" />
  <rect x="745" y="105" width="305" height="215" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5" />
  <text x="765" y="142" font-size="22" font-weight="bold" fill="#0F172A">3. 源要求与容量规划</text>
  <text x="765" y="178" font-size="20" fill="#334155">
    <tspan x="765" dy="0">提取有效要求、进度与报告</tspan>
    <tspan x="765" dy="30">第六节留占位，长读转坐标</tspan>
    <tspan x="765" dy="30">按保守 UTF-8 字节算上限</tspan>
    <tspan x="765" dy="30">溢出则 scale 翻倍缩减选区</tspan>
  </text>
  <line x1="1050" y1="212" x2="1090" y2="212" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow)" />
  <rect x="1095" y="105" width="300" height="215" rx="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5" />
  <text x="1115" y="142" font-size="22" font-weight="bold" fill="#0C4A6E">4. 单目标生成候选</text>
  <text x="1115" y="178" font-size="20" fill="#0369A1">
    <tspan x="1115" dy="0">固定首个目标 singleTarget</tspan>
    <tspan x="1115" dy="30">不自动切其他供应商兜底</tspan>
    <tspan x="1115" dy="30">默认首次 + 2 次重试(180s)</tspan>
    <tspan x="1115" dy="30">常规多块最多顺序 32 块</tspan>
  </text>
  <line x1="1210" y1="320" x2="1210" y2="430" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow)" />
  <line x1="1290" y1="435" x2="1290" y2="325" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p-arrow-amber)" />
  <text x="1250" y="382" text-anchor="middle" font-size="20" font-weight="bold" fill="#B45309">检查不通过：有限重试</text>
  <rect x="1095" y="435" width="300" height="225" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5" />
  <text x="1115" y="472" font-size="22" font-weight="bold" fill="#92400E">5. 完整候选严格校验</text>
  <text x="1115" y="508" font-size="20" fill="#78350F">
    <tspan x="1115" dy="0">九节结构 + 确定性填第六节</tspan>
    <tspan x="1115" dy="30">要求审计(词对齐阈值 0.6)</tspan>
    <tspan x="1115" dy="30">进度核对(自报非独立复验)</tspan>
    <tspan x="1115" dy="30">Tokens与UTF-8字节均缩小</tspan>
  </text>
  <line x1="895" y1="320" x2="895" y2="430" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p-arrow-amber)" />
  <line x1="1095" y1="525" x2="1055" y2="525" stroke="#B45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p-arrow-amber)" />
  <line x1="1055" y1="575" x2="1090" y2="575" stroke="#334155" stroke-width="2.5" marker-end="url(#p-arrow)" />
  <rect x="745" y="435" width="305" height="225" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5" />
  <text x="765" y="472" font-size="22" font-weight="bold" fill="#92400E">6. 后台容量分页接续</text>
  <text x="765" y="508" font-size="20" fill="#78350F">
    <tspan x="765" dy="0">容量 / 未缩小等特定情况</tspan>
    <tspan x="765" dy="30">四节笔记（默认 12 KiB）+</tspan>
    <tspan x="765" dy="30">有效要求逐字独立驻留</tspan>
    <tspan x="765" dy="30">保存已接受页与累计账本</tspan>
  </text>
  <path d="M 1245 660 L 1245 725 L 547 725 L 547 665" fill="none" stroke="#15803D" stroke-width="3" marker-end="url(#p-arrow-green)" />
  <text x="895" y="712" text-anchor="middle" font-size="20" font-weight="bold" fill="#15803D">完整校验全部通过后，才执行原文归档（非模型调用前归档）</text>
  <rect x="395" y="435" width="305" height="225" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="2.5" />
  <text x="415" y="472" font-size="22" font-weight="bold" fill="#14532D">7. 提交前原文归档</text>
  <text x="415" y="508" font-size="20" fill="#166534">
    <tspan x="415" dy="0">写入被替换跨度原文与附件</tspan>
    <tspan x="415" dy="30">回读校验条数与事件序号</tspan>
    <tspan x="415" dy="30">归档失败则中止并保留原文</tspan>
    <tspan x="415" dy="30">默认归档开启；失败阻止替换</tspan>
  </text>
  <line x1="395" y1="548" x2="355" y2="548" stroke="#15803D" stroke-width="3" marker-end="url(#p-arrow-green)" />
  <rect x="45" y="435" width="305" height="225" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="3" />
  <text x="65" y="472" font-size="22" font-weight="bold" fill="#14532D">8. 持久事务提交与继续</text>
  <text x="65" y="508" font-size="20" fill="#166534">
    <tspan x="65" dy="0">宿主先验指纹；备份原文件</tspan>
    <tspan x="65" dy="30">持久化替换 → 记录成功决定</tspan>
    <tspan x="65" dy="30">发布内存事件，继续当前会话</tspan>
    <tspan x="65" dy="30">历史原文通过工具按需回查</tspan>
  </text>
</svg>
